<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف التعريفي</title>

<style>

/* ===== دارك مود البروفايل ===== */
:root{
  --bg:#f6f7fb;
  --text:#111;
  --card:#ffffff;
}

[data-theme="dark"]{
  --bg:#0f1115;
  --text:#ffffff;
  --card:#1b1e24;
}

body{
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  margin:0;
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  max-width:520px;
  background:var(--card);
  padding:40px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  line-height:1.9;
}

.card{
  animation: cardEnter .8s ease both;
}

.card:hover{
  box-shadow:
    0 30px 70px rgba(0,0,0,.2);
  transform:translateY(-4px);
}

/* ===== Dark Mode – Card Light Beam Effect ===== */
[data-theme="dark"] .card{
  position: relative;
  overflow: hidden;
}

/* الشعاع */
[data-theme="dark"] .card::before{
  content:"";
  position:absolute;
  inset:-40%;

  background:
    linear-gradient(
      120deg,
      transparent 35%,
      rgba(255,255,255,.06),
      transparent 65%
    );

  transform: translateX(-100%);
  animation: cardBeam 6s ease-in-out infinite;

  pointer-events:none;
}



@keyframes cardEnter{
  from{
    opacity:0;
    transform:translateY(40px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes cardBeam{
  0%{
    transform: translateX(-100%);
  }
  50%{
    transform: translateX(100%);
  }
  100%{
    transform: translateX(100%);
  }
}



h1{
  text-align:center;
  margin-bottom:30px;
}

.back-btn{
  display:block;
  margin:40px auto 0;
  width:fit-content;
  padding:14px 40px;
  border-radius:999px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  font-size:16px;
  text-decoration:none;

  box-shadow:0 12px 30px rgba(37,99,235,.35);
  transition:.25s ease;
}

.back-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 40px rgba(37,99,235,.45);
}

.back-btn:active{
  transform:scale(.96);
}

.info-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;

  opacity:0;
  transform:translateY(16px);
  animation: infoReveal .5s ease forwards;
}

.info-row:nth-child(1){animation-delay:.1s}
.info-row:nth-child(2){animation-delay:.18s}
.info-row:nth-child(3){animation-delay:.26s}
.info-row:nth-child(4){animation-delay:.34s}
.info-row:nth-child(5){animation-delay:.42s}
.info-row:nth-child(6){animation-delay:.50s}
.info-row:nth-child(7){animation-delay:.58s}


@keyframes infoReveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}


.info-label{
  padding:6px 16px;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
  background:rgba(37,99,235,.12);
  color:#1e3a8a;
  white-space:nowrap;
}

.info-label{
  transition:.25s ease;
}

.info-row:hover .info-label{
  transform:scale(1.05);
}


[data-theme="dark"] .info-label{
  background:rgba(96,165,250,.22);
  color:#eaf1ff;
}

.info-value{
  font-size:17px;
  font-weight:600;
  word-break:break-word;
}

.email{
  font-family:monospace;
  font-size:15px;
}

.phone{
  letter-spacing:1px;
}

/* ===== Profile Title (Unified with Index) ===== */
.section-title{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:28px;
}

.profile-title{
  padding:14px 42px;
  border-radius:999px;

  font-size:clamp(22px, 3vw, 26px);
  font-weight:900;
  line-height:1.6;

  background:rgba(255,255,255,.9);
  color:#111;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    0 14px 32px rgba(0,0,0,.18);

  opacity:1;              /* ← المهم */
  transform:none;         /* ← المهم */
}

[data-theme="dark"] .profile-title{
  background:rgba(28,30,36,.95);
  color:#fff;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.06),
    0 18px 40px rgba(0,0,0,.8);
}

@keyframes titleReveal{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* منع التحديد عن عنوان الملف التعريفي */
.profile-title{
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

/* منع التحديد عن نص الزر */
.back-btn{
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

.info-label{
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}



</style>
</head>

<body>

<div class="page">
  <div class="card">

    <div class="section-title">
  <h2 class="profile-title">الملف التعريفي</h2>
</div>


<div class="info-row">
  <span class="info-label">الاسم</span>
  <span class="info-value">كريم احمد عباس</span>
</div>


    <div class="info-row">
  <span class="info-label">المدرسة</span>
  <span class="info-value">أبو بكر الصديق الرسمية لغات بنين</span>
</div>

<div class="info-row">
  <span class="info-label">المحافظة</span>
  <span class="info-value">الإسكندرية – إدارة المنتزه أول</span>
</div>

<div class="info-row">
  <span class="info-label">هاتف الطالب</span>
  <span class="info-value phone">01222604122</span>
</div>

<div class="info-row">
  <span class="info-label">هاتف ولي الأمر</span>
  <span class="info-value phone">01015003361</span>
</div>

    <a id="backBtn" class="back-btn"></a>


  </div>
</div>
<script>

/* ================================
   GLOBAL PAGE MEMORY SYSTEM
================================ */

const ONE_HOUR = 60 * 60 * 1000;
const currentPage = window.location.pathname;
const now = Date.now();

/* ---------- 1️⃣ حفظ الحالة ---------- */

function savePageState() {
  localStorage.setItem("lastPage", currentPage);
  localStorage.setItem("lastVisitTime", now);
  localStorage.setItem("scroll_" + currentPage, window.scrollY);
}

window.addEventListener("scroll", () => {
  localStorage.setItem("scroll_" + currentPage, window.scrollY);
});

window.addEventListener("beforeunload", savePageState);


/* ---------- 2️⃣ استرجاع المكان ---------- */

window.addEventListener("DOMContentLoaded", () => {

  const lastTime = localStorage.getItem("lastVisitTime");

  if (!lastTime) return;

  if (Date.now() - parseInt(lastTime) > ONE_HOUR) {
    return; // عدى ساعة → نبدأ من الأول
  }

  const savedScroll =
    localStorage.getItem("scroll_" + currentPage);

  if (!savedScroll) return;

  const scrollValue = parseInt(savedScroll);

  if (scrollValue > 0) {
    setTimeout(() => {
      window.scrollTo(0, scrollValue);
    }, 100);
  }

});


const savedTheme = localStorage.getItem("theme");

if (savedTheme) {
  document.body.dataset.theme = savedTheme;
}

const backBtn = document.getElementById("backBtn");
const from = localStorage.getItem("fromPage");

if (from === "Kkk") {
  backBtn.textContent = "العودة إلى الشاشة الرئيسية";
  backBtn.onclick = () => window.location.href = "he.html";
} else {
  backBtn.textContent = "العودة إلى البحث";
  backBtn.onclick = () => window.location.href = "search.html";
}



</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "searchanalytics-4bbbf.firebaseapp.com",
  databaseURL: "https://searchanalytics-4bbbf-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "searchanalytics-4bbbf",
  storageBucket: "searchanalytics-4bbbf.firebasestorage.app",
  messagingSenderId: "555407096660",
  appId: "1:555407096660:web:3a3865df93d90d4147e6c1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================
   1️⃣ OVERVIEW COUNTERS
========================= */

// total visits
db.ref("analytics/overview/totalVisits")
.transaction(v => (v || 0) + 1);

// total page views
db.ref("analytics/overview/pageViews")
.transaction(v => (v || 0) + 1);

// page specific views
const pageKey = window.location.pathname
.replace(/\//g,"_")
.replace(".html","") || "home";

db.ref("analytics/pages/" + pageKey + "/views")
.transaction(v => (v || 0) + 1);


/* =========================
   2️⃣ REALTIME USERS SYSTEM
========================= */

const connectedRef = db.ref(".info/connected");
const usersRef = db.ref("analytics/realtime/users");
const currentRef = db.ref("analytics/realtime/current");

connectedRef.on("value", function(snapshot){

  if(snapshot.val() === true){

    const userRef = usersRef.push();

    // تسجيل المستخدم
    userRef.set({
      page: pageKey,
      joined: Date.now()
    });

    // زيادة العداد
    currentRef.transaction(v => (v || 0) + 1);

    // لما يخرج
    userRef.onDisconnect().remove();
    currentRef.onDisconnect().transaction(v => Math.max((v || 1) - 1, 0));

  }

});

</script>

<script>
/* ===============================
   ADVANCED SESSION TRACKING
================================ */

const db = firebase.database();
const sessionId = db.ref("analytics/sessions").push().key;

const sessionRef = db.ref("analytics/sessions/" + sessionId);

/* ===== Device Detection ===== */
function getDeviceType() {
  const ua = navigator.userAgent;
  if (/mobile/i.test(ua)) return "Mobile";
  if (/tablet/i.test(ua)) return "Tablet";
  return "Desktop";
}

/* ===== Session Start ===== */
sessionRef.set({
  device: getDeviceType(),
  browser: navigator.userAgent,
  startTime: Date.now(),
  page: window.location.pathname,
  actions: {}
});

/* ===== Track Page Time ===== */
const startTime = Date.now();

window.addEventListener("beforeunload", () => {
  const duration = Date.now() - startTime;

  sessionRef.update({
    endTime: Date.now(),
    duration: duration
  });
});

/* ===== Track Clicks ===== */
document.addEventListener("click", function(e){
  const actionId = sessionRef.child("actions").push().key;

  sessionRef.child("actions/" + actionId).set({
    type: "click",
    target: e.target.tagName,
    time: Date.now()
  });
});

/* ===== Track Scroll ===== */
let scrollTimeout;

window.addEventListener("scroll", function(){
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const actionId = sessionRef.child("actions").push().key;

    sessionRef.child("actions/" + actionId).set({
      type: "scroll",
      position: window.scrollY,
      time: Date.now()
    });
  }, 800);
});
</script>
