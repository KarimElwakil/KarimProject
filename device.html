<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الجهاز</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

 function goBack(){
  window.location.href="Analytics.html"; // غير الاسم لو مختلف
}

const firebaseConfig = {
apiKey: "AIzaSyCs6OJNRdad5jwpaWOmEzs-Z_71QJcA-4M",
authDomain: "searchanalytics-4bbbf.firebaseapp.com",
databaseURL: "https://searchanalytics-4bbbf-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "searchanalytics-4bbbf",
};
firebase.initializeApp(firebaseConfig);
</script>

<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:20px}
.card{background:#111827;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

 <button onclick="goBack()" style="
background:#00ffc3;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-bottom:15px">
⬅ رجوع للداش بورد
</button>


<h2>تفاصيل الجهاز</h2>
<div id="info"></div>

<script>

 function drawChart(count){

const ctx = document.getElementById("sessionsChart");

new Chart(ctx,{
 type:"doughnut",
 data:{
  labels:["عدد الجلسات"],
  datasets:[{
   data:[count],
  }]
 },
});
}

const db = firebase.database();

const url = new URL(location.href);
const id = url.searchParams.get("id");

const container = document.getElementById("info");
container.innerHTML = "جاري تحميل بيانات الجهاز...";

db.ref("analytics/devices").once("value").then(snap=>{

 const devices = snap.val();
 if(!devices) return;

 let deviceData=null;
 let deviceKey=null;

 Object.keys(devices).forEach(k=>{
   if(k.includes(id)){
     deviceData = devices[k];
     deviceKey = k;
   }
 });

 if(!deviceData){
   container.innerHTML="لم يتم العثور على الجهاز";
   return;
 }

 drawDevice(deviceKey,deviceData);

});

function drawDevice(name,data){

 let totalSessions=0;
 let totalTime=0;
 let browsersHTML="";
 let sessionsHTML="";

 if(data.browsers){

  Object.keys(data.browsers).forEach(browser=>{

    const sessions = data.browsers[browser].sessions;
    const count = Object.keys(sessions).length;
    totalSessions+=count;

    browsersHTML+=`
    <div class="card">
    🌐 ${browser} — ${count} جلسة
    </div>`;

    Object.keys(sessions).forEach(sid=>{
      const s = sessions[sid];

      let dur = s.totalTimeSpent || 0;
      totalTime+=dur;

      sessionsHTML+=`
<div class="card">
<h4>🧠 جلسة</h4>
🕒 بدأ: ${sid}<br>
📍 ${s.city||""} ${s.country||"Egypt"}<br>
⏱ المدة: ${Math.floor(dur/60)} دقيقة<br>
📱 الجهاز: ${s.device||""}<br>
🌐 المتصفح: ${s.browser||""}
</div>`;

    });

  });

 }

 container.innerHTML=`
<div class="card">
<h3>📱 معلومات الجهاز</h3>
الاسم: ${name}<br>
عدد الجلسات: ${totalSessions}<br>
إجمالي الوقت: ${Math.floor(totalTime/60)} دقيقة
</div>

<div class="card">
<h3>🌐 المتصفحات</h3>
${browsersHTML || "لا يوجد"}
</div>

<div class="card">
<h3>🧠 الجلسات</h3>
${sessionsHTML || "لا يوجد جلسات"}
</div>
`;
drawChart(totalSessions);
drawMap(data);

}

 function drawMap(data){

 let country="Egypt";
 let city="";

 if(data.browsers){
  Object.values(data.browsers).forEach(b=>{
   Object.values(b.sessions).forEach(s=>{
     if(s.country && s.country!=="Unknown") country=s.country;
     if(s.city) city=s.city;
   });
  });
 }

 if(country==="Unknown" || !country) country="Egypt";

 let location = city ? `${city}, ${country}` : country;

 container.innerHTML+=`
 <div class="card">
 <h3>🌍 موقع الجهاز</h3>
 <iframe width="100%" height="260"
 src="https://maps.google.com/maps?q=${location}&output=embed">
 </iframe>
 </div>`;
}



</script>

<canvas id="sessionsChart" height="120"></canvas>


</body>
</html>
