<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الجهاز</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  

<script>

 function goBack(){
  window.location.href="Analytics.html"; // غير الاسم لو مختلف
}

const firebaseConfig = {
apiKey: "AIzaSyCs6OJNRdad5jwpaWOmEzs-Z_71QJcA-4M",
authDomain: "searchanalytics-4bbbf.firebaseapp.com",
databaseURL: "https://searchanalytics-4bbbf-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "searchanalytics-4bbbf",
};
firebase.initializeApp(firebaseConfig);
</script>

<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:20px}
.card{background:#111827;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

 <button onclick="goBack()" style="
background:#00ffc3;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-bottom:15px">
⬅ رجوع للداش بورد
</button>


<h2>تفاصيل الجهاز</h2>
<div id="info"></div>

<script>



const db = firebase.database();

const url = new URL(location.href);
const id = url.searchParams.get("id");

const container = document.getElementById("info");
container.innerHTML = "جاري تحميل بيانات الجهاز...";

const devicePath = "analytics/devices";

db.ref(devicePath).on("value", snap=>{

 const devices = snap.val();
 if(!devices) return;

 let deviceData=null;
 let deviceKey=null;

 Object.keys(devices).forEach(k=>{
   if(k.includes(id)){
     deviceData = devices[k];
     deviceKey = k;
   }
 });

 if(!deviceData){
   container.innerHTML="الجهاز غير موجود";
   return;
 }

 // إعادة رسم لحظي
 drawDevice(deviceKey,deviceData);

});


function drawDevice(name,data){

 let sessionsHTML="";
 let totalTimeAll=0;

 if(!data.browsers){
   container.innerHTML="لا يوجد جلسات";
   return;
 }

 Object.keys(data.browsers).forEach(browser=>{

   const sessions = data.browsers[browser].sessions;
   if(!sessions) return;

   Object.keys(sessions).forEach(sid=>{

     const s = sessions[sid];

     let totalSessionTime=0;
     let pagesCount=0;
     let online=false;
     let lastSeen="";

     if(s.info){
       if(s.info.isOnline) online=true;
       if(s.info.lastActive){
         lastSeen = new Date(s.info.lastActive).toLocaleString();
       }
     }

     if(s.pages){
       Object.values(s.pages).forEach(p=>{
         if(p.visits){
           Object.values(p.visits).forEach(v=>{
             if(v.durationSec){
               totalSessionTime += v.durationSec;
               totalTimeAll += v.durationSec;
             }
             pagesCount++;
           });
         }
       });
     }

     const statusColor = online ? "#00ffc3" : "#666";

     sessionsHTML += `
     <div class="card" 
     style="cursor:pointer;border-left:5px solid ${statusColor}"
     onclick="toggleSession('${sid}')">

     <b>🧠 جلسة ${browser}</b><br>
     ⏱ الوقت: ${(totalSessionTime/60).toFixed(1)} دقيقة<br>
     📄 عدد الصفحات: ${pagesCount}<br>
     👁 آخر ظهور: ${lastSeen || "—"}<br>
     ${online ? "🟢 نشط الآن" : "⚫ مغلق"}
     
     <div id="sess_${sid}" style="display:none;margin-top:10px"></div>

     </div>`;
   });

 });

 container.innerHTML = `
 <div class="card">
 <h3>📱 الجهاز</h3>
 ${name}<br>
 ⏱ إجمالي الوقت: ${(totalTimeAll/60).toFixed(1)} دقيقة
 </div>

 <div class="card">
 <h3>🧠 الجلسات</h3>
 ${sessionsHTML}
 </div>
 `;
}

  function toggleSession(id){

 const box = document.getElementById("sess_"+id);

 if(box.style.display==="block"){
   box.style.display="none";
   return;
 }

 box.style.display="block";

 const db = firebase.database();

 db.ref("analytics/devices").once("value").then(snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;

    if(b.sessions[id]){

      const session = b.sessions[id];
      drawPages(box,session);

    }
   });

  });

 });

}

  function drawPages(container,session){

 let html="";

 if(!session.pages){
   container.innerHTML="لا يوجد صفحات";
   return;
 }

 Object.keys(session.pages).forEach(pageName=>{

   html+=`
   <div class="card"
   style="cursor:pointer"
   onclick="togglePage('${pageName}','${session.info.start}')">
   📄 ${pageName}
   <div id="pg_${pageName+session.info.start}" style="display:none"></div>
   </div>`;
 });

 container.innerHTML = html;
}

  function togglePage(pageName,start){

 const id = "pg_"+pageName+start;
 const box = document.getElementById(id);

 if(box.style.display==="block"){
   box.style.display="none";
   return;
 }

 box.style.display="block";

 const db = firebase.database();

 db.ref("analytics/devices").once("value").then(snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;

    Object.values(b.sessions).forEach(s=>{

      if(s.info.start!=start) return;
      if(!s.pages || !s.pages[pageName]) return;

      const visits = s.pages[pageName].visits;
      if(!visits) return;

      let html="";

      Object.values(visits).forEach(v=>{

        html+=`
        <div class="card">
        ⏱ ${(v.durationSec||0)} ثانية<br>
        📜 scroll: ${v.maxScroll||0}%<br>
        🎨 theme: ${v.theme||""}<br>
        📱 ${v.device||""}<br>
        🌐 ${v.browser||""}
        </div>`;
      });

      box.innerHTML = html;

    });

   });

  });

 });

}



function drawMap(data){

 let country="Egypt";
 let city="";

 if(data.browsers){
  Object.values(data.browsers).forEach(b=>{
   Object.values(b.sessions).forEach(s=>{
     if(s.country && s.country!=="Unknown") country=s.country;
     if(s.city && s.city!=="Unknown") city=s.city;
   });
  });
 }

 if(country==="Unknown"||!country) country="Egypt";

 let location = city ? `${city}, ${country}` : country;

 container.innerHTML+=`
 <div style="
 background:#020617;
 padding:20px;
 border-radius:16px;
 margin-top:20px;
 border:1px solid #0f172a">

 <h3>🌍 الموقع</h3>

 <div style="margin-bottom:8px">
📍 <b>${location}</b>
</div>

 <iframe width="100%" height="180"
 style="border-radius:12px;border:none"
 src="https://maps.google.com/maps?q=${location}&output=embed">
 </iframe>

 </div>`;
}



</script>





</body>
</html>
