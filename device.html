<script>



const db = firebase.database();

const url = new URL(location.href);
const id = url.searchParams.get("id");

const container = document.getElementById("info");
container.innerHTML = "جاري تحميل بيانات الجهاز...";

const devicePath = "analytics/devices";

let firstLoad = true;

const deviceRef = db.ref("analytics/devices");

  let deviceDataCache = null;

// تحميل أول مرة فقط
deviceRef.once("value").then(snap=>{
 const devices = snap.val();
 if(!devices) return;

 Object.keys(devices).forEach(k=>{
   if(k.includes(id)){
     deviceDataCache = devices[k];

function drawDevice(name,data){

 let sessionsHTML="";
 let totalTimeAll=0;

 if(!data.browsers){
   container.innerHTML="لا يوجد جلسات";
   return;
 }

 Object.keys(data.browsers).forEach(browser=>{

   const sessions = data.browsers[browser].sessions;
   if(!sessions) return;

   Object.keys(sessions).forEach(sid=>{

     const s = sessions[sid];

     let totalSessionTime=0;
     let pagesCount=0;
     let online=false;
     let lastSeen="";

     if(s.info){
       if(s.info.isOnline) online=true;
       if(s.info.lastActive){
         lastSeen = new Date(s.info.lastActive).toLocaleString();
       }
     }

     if(s.pages){
       Object.values(s.pages).forEach(p=>{
         if(p.visits){
           Object.values(p.visits).forEach(v=>{
             if(v.durationSec){
               totalSessionTime += v.durationSec;
               totalTimeAll += v.durationSec;
             }
             pagesCount++;
           });
         }
       });
     }

     const statusColor = online ? "#00ffc3" : "#666";

sessionsHTML += `
<div class="card" style="border-left:5px solid ${statusColor};position:relative">

<!-- 🔵 تفاصيل الجلسة فوق -->
<div style="margin-bottom:12px">

<b>🧠 جلسة ${browser}</b><br>
⏱ الوقت: ${(totalSessionTime/60).toFixed(1)} دقيقة<br>
📄 عدد الصفحات: ${pagesCount}<br>
👁 آخر ظهور: ${lastSeen || "—"}<br>
${online ? "🟢 نشط الآن" : "⚫ مغلق"}

</div>

<!-- 🔵 الزرارين شمال -->

<div style="
position:absolute;
left:15px;
top:15px;
display:flex;
gap:8px">

<button onclick="closeSession('${sid}')" 
id="btn_close_${sid}"
style="
background:#ff3b3b;
border:none;
padding:8px 16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
display:none">
⛔ اغلاق الجلسة
</button>

<button onclick="showPages('${sid}')" 
id="btn_pages_${sid}" 
class="switchBtn">
📄 الصفحات
</button>

<button onclick="showDevice('${sid}')" 
id="btn_device_${sid}" 
class="switchBtn">
📱 معلومات الجهاز
</button>

</div>



<!-- 🔵 المحتوى -->
<div id="sess_${safeId(sid)}" style="margin-top:15px"></div>

</div>
`;

   });

 });

 container.innerHTML = `
 <div class="card">
 <h3>📱 الجهاز</h3>
 ${name}<br>
 ⏱ إجمالي الوقت: ${(totalTimeAll/60).toFixed(1)} دقيقة
 </div>

 <div class="card">
 <h3>🧠 الجلسات</h3>
 ${sessionsHTML}
 </div>
 `;

  setTimeout(()=>{

 if(openedSession){
   const el = document.querySelector(`[onclick*="${openedSession}"]`);

 }

 if(openedPage){
   const el2 = document.getElementById("flow_"+openedPage);
   if(el2){
     const parent = el2.closest(".card");
     if(parent) parent.click();
   }
 }

},300);

}

  


function toggleSession(id){

 openedSession = id;

 const box = document.getElementById("sess_"+safeId(id));

 if(box.style.display==="block"){
   box.style.display="none";
   openedSession = null;

   // افصل اللايف
   if(liveSessionListener){
     liveSessionListener.off();
     liveSessionListener = null;
   }

   return;
 }

 box.style.display="block";

 const db = firebase.database();








 db.ref("analytics/devices").once("value").then(snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;

    if(b.sessions[id]){

      const session = b.sessions[id];
      drawPages(box,session);
      startLiveSession(id);


    }

   });

  });

 });
  
}     



 function togglePage(pageName,start){

 const id = "pg_"+pageName+"_"+start;
 const box = document.getElementById(id);

 if(box.style.display==="block"){
   box.style.display="none";
   return;
 }

 box.style.display="block";

 const db = firebase.database();

 db.ref("analytics/devices").once("value").then(snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;

    Object.values(b.sessions).forEach(s=>{

      if(!s.info || s.info.start!=start) return;
      if(!s.pages || !s.pages[pageName]) return;

      const visits = s.pages[pageName].visits;
      if(!visits) return;

      let html="";

      Object.values(visits).forEach(v=>{

        html+=`
        <div style="
        background:#020617;
        padding:10px;
        border-radius:10px;
        margin:6px 0;
        border:1px solid #0f172a">

        ⏱ الوقت: ${(v.durationSec||0)} ثانية<br>
        📜 scroll: ${v.maxScroll||0}%<br>
       🎨 theme ${v.theme==="dark"?"🌙 Dark":"☀️ Light"}<br>
        📱 ${v.device||""}<br>
        🌐 ${v.browser||""}
        </div>
        `;

      });

    

      box.innerHTML = html || "لا بيانات";

    });

   });

  });

 });

}




function drawPages(container,session){

 if(!session.flow){
   container.innerHTML="لا يوجد مسار";
   return;
 }

 const flowArr = Object.values(session.flow).sort((a,b)=>a.time-b.time);

 let html="";
 let i=1;

 flowArr.forEach(step=>{

   const pageName = step.page;
   const stepTime = step.time;
   const uid = "flow_"+stepTime;

   html+=`
   <div class="card"
   style="cursor:pointer;background:#020617;border-left:4px solid #00ffc3"
   onclick="event.stopPropagation();openVisit('${pageName}','${session.info.start}','${stepTime}')">

   <b>${i}️⃣ ${pageName}</b>
  <div id="${uid}" data-page="${pageName}" data-time="${stepTime}" 
style="display:none;margin-top:10px"></div>
   </div>
   `;

   i++;
 });

 container.innerHTML = html;
}

  function openVisit(pageName,start,stepTime){
openedPage = stepTime;


 const box = document.getElementById("flow_"+stepTime);

 if(box.style.display==="block"){
   box.style.display="none";
   return;
 }

 box.style.display="block";

 const db = firebase.database();

 db.ref("analytics/devices").once("value").then(snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;

    Object.values(b.sessions).forEach(s=>{

      if(!s.info || s.info.start!=start) return;
      if(!s.pages || !s.pages[pageName]) return;

      const visits = Object.values(s.pages[pageName].visits || {});
      if(!visits.length) return;

      // نجيب أقرب زيارة حسب التوقيت
      let closest = visits[0];
      let minDiff = Math.abs(visits[0].enterTimestamp - stepTime);

      visits.forEach(v=>{
        const diff = Math.abs(v.enterTimestamp - stepTime);
        if(diff < minDiff){
          minDiff = diff;
          closest = v;
        }
      });

      const v = closest;
const isLast = s.info?.isOnline &&
Math.abs(Date.now() - v.enterTimestamp) < 30000;


box.innerHTML = `
<div style="background:#020617;padding:12px;border-radius:12px">

⏱ ${v.durationSec||0} ثانية<br>
📜 scroll: ${v.maxScroll||0}%<br>
🎨 ${v.theme||"light"}<br>

${isLast 
 ? "<span style='color:#00ffc3'>🟢 متصل الآن</span>"
 : "<span style='color:#888'>⚫ تم الانتهاء</span>"}

</div>
`;


    });

   });

  });

 });
}

 let city="";

 if(data.browsers){

  function refreshOpenSession(data){

 if(!openedSession) return;

 if(!data.browsers) return;

 Object.values(data.browsers).forEach(browser=>{
  if(!browser.sessions) return;
  if(!browser.sessions[openedSession]) return;

  const s = browser.sessions[openedSession];

  let total=0;
  let pages=0;

  if(s.pages){
   Object.values(s.pages).forEach(p=>{
    if(p.visits){
     Object.values(p.visits).forEach(v=>{
      if(v.durationSec) total+=v.durationSec;
      pages++;
     });
    }
   });
  }

  const box=document.getElementById("sess_"+safeId(openedSession));
  if(!box) return;

  box.querySelectorAll(".liveTime").forEach(el=>{
    el.innerText=(total/60).toFixed(1);
  });

 });
}


 
  function startLiveSession(sessionId){

 // اقفل القديم
 if(liveSessionListener){
   liveSessionListener.off();
 }

 // اسمع على الجلسة فقط
 const ref = firebase.database().ref("analytics/devices");

 liveSessionListener = ref;

 ref.on("value", snap=>{

  const devices = snap.val();
  if(!devices) return;

  Object.values(devices).forEach(device=>{
   if(!device.browsers) return;

   Object.values(device.browsers).forEach(b=>{
    if(!b.sessions) return;
    if(!b.sessions[sessionId]) return;

    const session = b.sessions[sessionId];

    updateLivePagesOnly(session);

   });

  });

 });
}

function updateLivePagesOnly(session){

 if(!openedPage) return;

 const boxes = document.querySelectorAll("[id^='flow_']");

 boxes.forEach(box=>{

   if(box.style.display!=="block") return;

   const pageName = box.getAttribute("data-page");
   const stepTime = box.getAttribute("data-time");

   if(!session.pages || !session.pages[pageName]) return;

   const visits = Object.values(session.pages[pageName].visits||{});
   if(!visits.length) return;

   let closest = visits[0];
   let minDiff = Math.abs(visits[0].enterTimestamp - stepTime);

   visits.forEach(v=>{
     const diff = Math.abs(v.enterTimestamp - stepTime);
     if(diff < minDiff){
       minDiff = diff;
       closest = v;
     }
   });

   const v = closest;

   box.innerHTML = `
   <div style="background:#020617;padding:12px;border-radius:12px">
   ⏱ ${(v.durationSec||0)} ثانية<br>
   📜 scroll: ${v.maxScroll||0}%<br>
   🎨 ${v.theme||"light"}<br>
   📱 ${v.device||""}<br>
   🌐 ${v.browser||""}
   </div>`;
 });
}


function showPages(id){

// اقفل أي جلسة مفتوحة
if(openedSession && openedSession !== id){

 document.getElementById("sess_"+safeId(openedSession)).innerHTML="";

 document.getElementById("btn_pages_"+openedSession).style.display="inline-block";
 document.getElementById("btn_device_"+openedSession).style.display="inline-block";
 document.getElementById("btn_close_"+openedSession).style.display="none";
}

openedSession=id;

const closeBtn=document.getElementById("btn_close_"+id);
closeBtn.style.display="inline-block";

const box=document.getElementById("sess_"+safeId(id));
const btnPages=document.getElementById("btn_pages_"+id);
const btnDevice=document.getElementById("btn_device_"+id);

btnPages.style.display="none";
btnDevice.style.display="inline-block";

loadSessionPages(id,box);
}

  
function showDevice(id){

// اقفل أي جلسة مفتوحة
if(openedSession && openedSession !== id){

 document.getElementById("sess_"+safeId(openedSession)).innerHTML="";

 document.getElementById("btn_pages_"+openedSession).style.display="inline-block";
 document.getElementById("btn_device_"+openedSession).style.display="inline-block";
 document.getElementById("btn_close_"+openedSession).style.display="none";
}

openedSession=id;

const closeBtn=document.getElementById("btn_close_"+id);
closeBtn.style.display="inline-block";

const box=document.getElementById("sess_"+safeId(id));
const btnPages=document.getElementById("btn_pages_"+id);
const btnDevice=document.getElementById("btn_device_"+id);

btnDevice.style.display="none";
btnPages.style.display="inline-block";

}

  function loadSessionPages(sessionId,box){

db.ref("analytics/devices").once("value").then(snap=>{
 const devices = snap.val();
 if(!devices) return;

 Object.values(devices).forEach(device=>{
  if(!device.browsers) return;

  Object.values(device.browsers).forEach(b=>{
   if(!b.sessions) return;
   if(!b.sessions[sessionId]) return;

   drawPages(box,b.sessions[sessionId]);
  });
 });

});
}


 function loadDeviceInfo(sessionId,box){

db.ref("analytics/devices").once("value").then(snap=>{
 const devices = snap.val();
 if(!devices) return;

 let found = false;

 Object.keys(devices).forEach(deviceKey=>{

  const device = devices[deviceKey];
  if(!device.browsers) return;

  Object.keys(device.browsers).forEach(browserKey=>{

    const browser = device.browsers[browserKey];
    if(!browser.sessions) return;

    if(browser.sessions[sessionId]){
      const s = browser.sessions[sessionId];


      found = true;

     const info = s.info || {};

box.innerHTML = `
<div style="
background:#020617;
padding:15px;
border-radius:12px;
border:1px solid #0f172a">

🧠 نوع الجهاز: ${s.device || "غير معروف"}<br>
🌐 المتصفح: ${s.browser || "غير معروف"}<br>
💻 النظام: ${s.os || "غير معروف"}<br>
🌍 الدولة: ${s.country || "غير معروف"}<br>
🏙 المدينة: ${s.city || "غير معروف"}<br>
📡 الشبكة: ${s.networkType || "غير معروف"}<br>
🗣 اللغة: ${s.language || "غير معروف"}<br>
🎨 الثيم: ${info.theme || "غير معروف"}<br>
⚡ السرعة: ${s.downlink || "—"}<br>
🟢 الحالة: ${info.isOnline ? "متصل الآن" : "غير متصل"}<br>

</div>
`;

     
    }

  });

 });

 if(!found){
   box.innerHTML = "لا توجد بيانات جهاز لهذه الجلسة";
 }

});
}

 function closeSession(sessionId){

db.ref("analytics/devices").once("value").then(snap=>{
 const devices = snap.val();
 if(!devices) return;

 Object.keys(devices).forEach(deviceKey=>{
  const device = devices[deviceKey];
  if(!device.browsers) return;

  Object.keys(device.browsers).forEach(browserKey=>{
    const browser = device.browsers[browserKey];
    if(!browser.sessions) return;

    if(browser.sessions[sessionId]){

      db.ref(`analytics/devices/${deviceKey}/browsers/${browserKey}/sessions/${sessionId}/info/isOnline`).set(false);

      // رجع الزراير
      document.getElementById("btn_pages_"+sessionId).style.display="inline-block";
      document.getElementById("btn_device_"+sessionId).style.display="inline-block";
      document.getElementById("btn_close_"+sessionId).style.display="none";

      document.getElementById("sess_"+sessionId).innerHTML =
      "<div style='color:#888'>تم اغلاق الجلسة</div>";

    }

  });

 });
});
}


let currentDeviceData = null;

deviceRef.on("value",snap=>{
 const devices = snap.val();
 if(!devices) return;

 Object.keys(devices).forEach(k=>{
   if(!k.includes(id)) return;

   const newData = devices[k];

   // أول تحميل فقط
   if(!currentDeviceData){
     currentDeviceData = newData;
     drawDevice(k,newData);
     return;
   }

   // لو مفيش تغيير حقيقي → تجاهل
   if(JSON.stringify(newData) === JSON.stringify(currentDeviceData)) return;

   currentDeviceData = newData;

   // 🔥 تحديث خفيف فقط
   updateLiveOnly(newData);

 });
});

  function updateLiveOnly(data){

if(!data.browsers) return;

Object.values(data.browsers).forEach(browser=>{
 if(!browser.sessions) return;

 Object.keys(browser.sessions).forEach(sid=>{
   const s = browser.sessions[sid];

   const card = document.querySelector(`#sess_${sid}`)?.closest(".card");
   if(!card) return;

   let online=false;
   let lastSeen="";
   let total=0;
   let pages=0;

   if(s.info){
     if(s.info.isOnline) online=true;
     if(s.info.lastActive){
       lastSeen=new Date(s.info.lastActive).toLocaleString();
     }
   }

   if(s.pages){
     Object.values(s.pages).forEach(p=>{
       if(p.visits){
         Object.values(p.visits).forEach(v=>{
           if(v.durationSec) total+=v.durationSec;
           pages++;
         });
       }
     });
   }

   // تحديث النص فقط
   card.querySelectorAll(".liveOnline").forEach(e=>{
     e.innerHTML = online ? "🟢 نشط الآن" : "⚫ مغلق";
   });

   card.querySelectorAll(".liveLast").forEach(e=>{
     e.innerHTML = lastSeen;
   });

 });
});
}
