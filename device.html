<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الجهاز</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  

<script>

 function goBack(){
  window.location.href="Analytics.html"; // غير الاسم لو مختلف
}

const firebaseConfig = {
apiKey: "AIzaSyCs6OJNRdad5jwpaWOmEzs-Z_71QJcA-4M",
authDomain: "searchanalytics-4bbbf.firebaseapp.com",
databaseURL: "https://searchanalytics-4bbbf-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "searchanalytics-4bbbf",
};
firebase.initializeApp(firebaseConfig);
</script>

<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:20px}
.card{background:#111827;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

 <button onclick="goBack()" style="
background:#00ffc3;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-bottom:15px">
⬅ رجوع للداش بورد
</button>


<h2>تفاصيل الجهاز</h2>
<div id="info"></div>

<script>



const db = firebase.database();

const url = new URL(location.href);
const id = url.searchParams.get("id");

const container = document.getElementById("info");
container.innerHTML = "جاري تحميل بيانات الجهاز...";

const devicePath = "analytics/devices";

db.ref(devicePath).on("value", snap=>{

 const devices = snap.val();
 if(!devices) return;

 let deviceData=null;
 let deviceKey=null;

 Object.keys(devices).forEach(k=>{
   if(k.includes(id)){
     deviceData = devices[k];
     deviceKey = k;
   }
 });

 if(!deviceData){
   container.innerHTML="الجهاز غير موجود";
   return;
 }

 // إعادة رسم لحظي
 drawDevice(deviceKey,deviceData);

});


function drawDevice(name,data){

 let totalSessions=0;
 let totalTime=0;
 let sessionsHTML="";
 let deviceLastSeen=0;

 if(!data.browsers){
   container.innerHTML="لا توجد بيانات";
   return;
 }

 Object.keys(data.browsers).forEach(browser=>{

  const sessions = data.browsers[browser].sessions;
  if(!sessions) return;

  Object.keys(sessions).forEach(sid=>{

    const s = sessions[sid];
    totalSessions++;

    // ===== last seen =====
    let lastSeenTxt="غير معروف";
    if(s.lastActive){
      const diff=Math.floor((Date.now()-s.lastActive)/1000);
      if(diff<60) lastSeenTxt="الآن";
      else if(diff<3600) lastSeenTxt=Math.floor(diff/60)+" دقيقة";
      else lastSeenTxt=Math.floor(diff/3600)+" ساعة";
    }

    if(s.lastActive && s.lastActive>deviceLastSeen)
      deviceLastSeen=s.lastActive;

    // ===== online =====
    let onlineBadge = s.isOnline
     ? `<span style="color:#00ffa6">● متصل الآن</span>`
     : `<span style="color:#777">غير متصل</span>`;

    // ===== location =====
    let country = s.country && s.country!=="Unknown" ? s.country : "Egypt";
    let city = s.city && s.city!=="Unknown" ? s.city : "";
    let location = city ? `${city}, ${country}` : country;

    // ===== الصفحات =====
    let pagesHTML="";
    if(s.pages){
      Object.keys(s.pages).forEach(p=>{

        const page = s.pages[p];
        let visits = page.visits || {};

        Object.keys(visits).forEach(v=>{
          const visit = visits[v];

          pagesHTML+=`
          <div style="
          background:#0f172a;
          padding:10px;
          border-radius:10px;
          margin-top:8px;
          font-size:13px">

          📄 <b>${p}</b><br>

          ⏱ مدة: ${visit.durationSec||0} ثانية<br>

          📜 scroll: ${visit.maxScroll||0}%<br>

          <div style="
height:6px;
background:#111;
border-radius:6px;
margin-top:6px">
<div style="
width:${visit.maxScroll||0}%;
background:#00ffc3;
height:6px;
border-radius:6px">
</div>
</div>


          ↩ من: ${visit.from||"direct"}<br>

          🕒 دخول: ${visit.enterTime||""}<br>
          📴 خروج: ${visit.exitTimeReadable||"لم يخرج"}

          </div>`;
        });
      });
    }

    sessionsHTML+=`
    <div style="
    background:#111827;
    padding:15px;
    border-radius:14px;
    margin-bottom:18px;
    border:1px solid #1f2937">

    <div style="font-size:14px;margin-bottom:8px">
    ${onlineBadge}
    </div>

    <b>🧠 جلسة:</b> ${sid}<br>

    📍 ${location}<br>
    🌐 ${browser}<br>
    📱 ${s.device||""}<br>

    🕒 آخر ظهور: ${lastSeenTxt}

    <div style="
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #222">

    <b>📊 الصفحات:</b>
    ${pagesHTML||"لا يوجد تصفح"}

    </div>

    </div>
    `;

    // تحليل المستخدم
let behavior="زائر جديد";

if(totalSessions>5) behavior="زائر متكرر";
if(totalSessions>15) behavior="زائر مخلص 🔥";
if(totalSessions>30) behavior="مدمن الموقع 😈";

container.innerHTML+=`
<div style="
background:#020617;
padding:18px;
border-radius:14px;
margin-top:20px;
border:1px solid #0f172a">

<h3>🧠 تحليل المستخدم</h3>
${behavior}

</div>`;

  });

 });

 // ===== last seen للجهاز =====
 let deviceSeen="غير معروف";
 if(deviceLastSeen){
   const diff=Math.floor((Date.now()-deviceLastSeen)/1000);
   if(diff<60) deviceSeen="الآن";
   else if(diff<3600) deviceSeen=Math.floor(diff/60)+" دقيقة";
   else deviceSeen=Math.floor(diff/3600)+" ساعة";
 }

  let isOnlineNow = false;

if(data.browsers){
 Object.values(data.browsers).forEach(b=>{
  Object.values(b.sessions).forEach(s=>{
   if(s.isOnline === true){
     isOnlineNow = true;
   }
  });
 });
}


 container.innerHTML=`

 <div style="
 background:#020617;
 padding:20px;
 border-radius:16px;
 margin-bottom:20px;
 border:1px solid #0f172a">


${isOnlineNow ? 
'<div style="color:#00ffa6;font-weight:bold;margin-bottom:8px">🟢 يتصفح الآن</div>' 
:
'<div style="color:#666;margin-bottom:8px">⚫ غير متصل</div>'
}

 <h2>📱 الجهاز</h2>

 🧠 عدد الجلسات: ${totalSessions}<br>
 🕒 آخر ظهور للجهاز: ${deviceSeen}

 </div>

 ${sessionsHTML}

 `;

 drawMap(data);
}


function drawMap(data){

 let country="Egypt";
 let city="";

 if(data.browsers){
  Object.values(data.browsers).forEach(b=>{
   Object.values(b.sessions).forEach(s=>{
     if(s.country && s.country!=="Unknown") country=s.country;
     if(s.city && s.city!=="Unknown") city=s.city;
   });
  });
 }

 if(country==="Unknown"||!country) country="Egypt";

 let location = city ? `${city}, ${country}` : country;

 container.innerHTML+=`
 <div style="
 background:#020617;
 padding:20px;
 border-radius:16px;
 margin-top:20px;
 border:1px solid #0f172a">

 <h3>🌍 الموقع</h3>

 <div style="margin-bottom:8px">
📍 <b>${location}</b>
</div>

 <iframe width="100%" height="180"
 style="border-radius:12px;border:none"
 src="https://maps.google.com/maps?q=${location}&output=embed">
 </iframe>

 </div>`;
}



</script>





</body>
</html>
