<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحليلات</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: hsl(220, 20%, 7%);
      --fg: hsl(210, 20%, 95%);
      --card: hsl(220, 18%, 10%);
      --card-60: hsla(220, 18%, 10%, 0.6);
      --primary: hsl(175, 80%, 50%);
      --primary-fg: hsl(220, 20%, 7%);
      --accent: hsl(260, 60%, 60%);
      --secondary: hsl(220, 15%, 16%);
      --secondary-50: hsla(220, 15%, 16%, 0.5);
      --secondary-30: hsla(220, 15%, 16%, 0.3);
      --muted: hsl(215, 15%, 55%);
      --border: hsl(220, 15%, 18%);
      --border-50: hsla(220, 15%, 18%, 0.5);
      --success: hsl(150, 60%, 45%);
      --destructive: hsl(0, 70%, 55%);
      --warning: hsl(38, 90%, 55%);
      --chart-1: hsl(175, 80%, 50%);
      --chart-2: hsl(260, 60%, 60%);
      --chart-3: hsl(150, 60%, 45%);
      --chart-4: hsl(38, 90%, 55%);
      --chart-5: hsl(340, 65%, 55%);
      --radius: 0.75rem;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
    @media (min-width: 768px) { .container { padding: 2rem; } }

    /* Glass Card */
    .glass {
      background: var(--card-60);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-50);
      border-radius: var(--radius);
      transition: border-color 0.5s;
    }
    .glass:hover { border-color: hsla(175, 80%, 50%, 0.3); }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Animations */
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideRight { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideLeft { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px hsla(175,80%,50%,0.1); } 50% { box-shadow: 0 0 30px hsla(175,80%,50%,0.25); } }

    .anim-up { opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
    .anim-down { opacity: 0; animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    .anim-right { opacity: 0; animation: slideRight 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    .anim-left { opacity: 0; animation: slideLeft 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    .anim-scale { opacity: 0; animation: scaleIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    @media (min-width: 768px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid-2 { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; } }

    /* Stat Card */
    .stat-card { padding: 1.25rem; }
    .stat-card .stat-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.75rem; }
    .stat-card .stat-label { font-size: 0.875rem; color: var(--muted); font-weight: 500; }
    .stat-card .stat-icon { padding: 0.5rem; border-radius: 0.5rem; background: hsla(175,80%,50%,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; transition: all 0.5s; }
    .stat-card:hover .stat-icon { animation: pulseGlow 2s ease-in-out infinite; }
    .stat-card .stat-value { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 0.25rem; }
    .stat-card .stat-change { font-size: 0.75rem; font-weight: 500; }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--destructive); }

    /* Section title */
    .section-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; }

    /* Progress bar */
    .progress-bg { height: 6px; background: var(--secondary); border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 1s ease-out; }

    /* List items */
    .list-item { display: flex; align-items: center; gap: 0.75rem; }
    .list-item .flag { font-size: 1.5rem; }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
    .list-item .name { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .count { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
    .list-item .pct { font-size: 0.75rem; color: var(--primary); font-family: var(--mono); width: 3rem; text-align: left; }

    /* Device type card */
    .device-type { text-align: center; padding: 1rem; border-radius: var(--radius); background: var(--secondary-50); transition: all 0.3s; cursor: default; }
    .device-type:hover { background: var(--secondary); }
    .device-type .emoji { font-size: 1.875rem; margin-bottom: 0.5rem; display: block; }
    .device-type:hover .emoji { animation: float 2s ease-in-out infinite; }
    .device-type .dt-count { font-size: 1.25rem; font-weight: 700; }
    .device-type .dt-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .device-type .dt-pct { font-size: 0.75rem; color: var(--primary); font-family: var(--mono); margin-top: 0.25rem; }

    /* Device name row */
    .device-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; border-radius: 0.5rem; background: var(--secondary-30); transition: background 0.3s; }
    .device-row:hover { background: var(--secondary-50); }
    .device-row .dr-left { display: flex; align-items: center; gap: 0.75rem; }
    .device-row .dr-rank { width: 2rem; height: 2rem; border-radius: 0.5rem; background: hsla(175,80%,50%,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--primary); }
    .device-row .dr-name { font-size: 0.875rem; font-weight: 500; }
    .device-row .dr-brand { font-size: 0.75rem; color: var(--muted); }
    .device-row .dr-count { font-size: 0.875rem; font-family: var(--mono); color: var(--primary); }

    /* Browser/OS bars */
    .bar-item { margin-bottom: 0.75rem; }
    .bar-item .bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem; }
    .bar-item .bar-name { font-size: 0.875rem; font-weight: 500; }
    .bar-item .bar-count { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
    .bar-item .bar-pct { font-size: 0.75rem; color: var(--primary); font-family: var(--mono); }

    /* Table */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: right; font-size: 0.75rem; font-weight: 500; color: var(--muted); padding-bottom: 0.75rem; padding-left: 1rem; border-bottom: 1px solid var(--border-50); }
    .data-table td { padding: 0.75rem 1rem 0.75rem 0; font-size: 0.875rem; border-bottom: 1px solid hsla(220,15%,18%,0.2); }
    .data-table tr:hover td { background: var(--secondary-30); }
    .data-table .mono { font-family: var(--mono); }
    .data-table .primary { color: var(--primary); }
    .data-table .accent { color: var(--accent); }

    /* Traffic source */
    .source-item { display: flex; align-items: center; gap: 0.75rem; }
    .source-item .source-icon { font-size: 1.25rem; width: 2rem; text-align: center; }

    /* Realtime */
    .realtime { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; flex-wrap: wrap; }
    .realtime .dot-wrapper { position: relative; }
    .realtime .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--success); }
    .realtime .dot-ping { position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--success); animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite; }
    .realtime .rt-label { font-size: 0.875rem; color: var(--muted); }
    .realtime .rt-value { font-size: 1.5rem; font-weight: 700; font-family: var(--mono); margin-right: 0.5rem; }
    .realtime .rt-sub { margin-right: auto; font-size: 0.75rem; color: var(--muted); }
    .realtime .rt-sub span { color: var(--primary); font-family: var(--mono); }

    /* Chart container */
    .chart-box { padding: 1.25rem; }
    .chart-box canvas { width: 100% !important; }
    .chart-toggle { display: flex; gap: 0.25rem; padding: 0.25rem; border-radius: 0.5rem; background: var(--secondary-50); }
    .chart-toggle button { padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.3s; font-family: var(--font); }
    .chart-toggle button.active { background: var(--primary); color: var(--primary-fg); }
    .chart-toggle button:not(.active) { background: transparent; color: var(--muted); }
    .chart-toggle button:not(.active):hover { color: var(--fg); }

    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }

    /* Select */
    .custom-select { background: var(--card-60); backdrop-filter: blur(24px); border: 1px solid var(--border-50); border-radius: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; color: var(--fg); font-family: var(--font); outline: none; cursor: pointer; }
    .custom-select option { background: var(--card); color: var(--fg); }

    /* Header */
    .header { margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 768px) { .header { flex-direction: row; align-items: center; justify-content: space-between; } }
    .header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; }
    @media (min-width: 768px) { .header h1 { font-size: 2.25rem; } }
    .header .subtitle { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; }

    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .p-5 { padding: 1.25rem; }
    .space-y > * + * { margin-top: 0.75rem; }
    .space-y-sm > * + * { margin-top: 0.625rem; }

    .footer { text-align: center; padding: 1.5rem 0; font-size: 0.75rem; color: var(--muted); }

    /* Responsive overflow */
    .overflow-x { overflow-x: auto; }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- Header -->
  <header class="header anim-down">
    <div>
      <h1 class="gradient-text">لوحة التحليلات</h1>
      <p class="subtitle">إحصائيات شاملة لموقعك · آخر 30 يوم</p>
    </div>
    <div>
      <select class="custom-select" id="dateRange">
        <option value="30">آخر 30 يوم</option>
        <option value="7">آخر 7 أيام</option>
        <option value="90">آخر 90 يوم</option>
        <option value="365">آخر سنة</option>
      </select>
    </div>
  </header>

  <!-- Realtime -->
  <div class="glass realtime anim-down mb-6" style="animation-delay:100ms">
    <div class="dot-wrapper">
      <div class="dot-ping"></div>
      <div class="dot"></div>
    </div>
    <div>
      <span class="rt-label">متصل الآن</span>
      <span class="rt-value" id="realtimeCount">--</span>

    </div>
   <div class="rt-sub">
  آخر 30 دقيقة: <span id="last30Min">--</span>
</div>

  </div>

  <!-- Stat Cards Row 1 -->
  <div class="grid-4 mb-6" id="statsRow1"></div>

  <!-- Stat Cards Row 2 -->
  <div class="grid-4 mb-6" id="statsRow2"></div>

 

  

  <!-- Country + Devices -->
  <div class="grid-2 mb-6">
    <div class="glass p-5 anim-up" style="animation-delay:300ms">
      <h3 class="section-title">🌍 الزوار حسب البلد</h3>
      <div class="space-y" id="countryList"></div>
    </div>
    <div>
      <div class="glass p-5 anim-up mb-4" style="animation-delay:350ms">
        <h3 class="section-title">📱 أنواع الأجهزة</h3>
        <div class="grid-3" id="deviceTypes"></div>
      </div>
      <div class="glass p-5 anim-up" style="animation-delay:400ms">
        <h3 class="section-title">📋 أسماء الأجهزة</h3>
        <div class="space-y-sm" id="deviceNames"></div>
      </div>
    </div>
  </div>

  <!-- Browsers & OS -->
  <div class="grid-2 mb-6">
    <div class="glass p-5 anim-up" style="animation-delay:450ms">
      <h3 class="section-title">🌐 المتصفحات</h3>
      <div id="browserList"></div>
    </div>
    <div class="glass p-5 anim-up" style="animation-delay:500ms">
      <h3 class="section-title">💻 أنظمة التشغيل</h3>
      <div id="osList"></div>
    </div>
  </div>

  <!-- Pages & Sources -->
  <div class="grid-2 mb-6">
    <div class="glass p-5 anim-up" style="animation-delay:550ms">
      <h3 class="section-title">📄 أكثر الصفحات زيارة</h3>
      <div class="overflow-x">
        <table class="data-table" id="pagesTable">
          <thead>
            <tr>
              <th>الصفحة</th>
              <th>المسار</th>
              <th>المشاهدات</th>
              <th>الزوار الفريدين</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="glass p-5 anim-up" style="animation-delay:600ms">
      <h3 class="section-title">📊 مصادر الترافيك</h3>
      <div class="space-y" id="sourcesList"></div>
    </div>
  </div>

  <footer class="footer anim-up" style="animation-delay:800ms">
    
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
 const firebaseConfig = {
  apiKey: "AIzaSyCs6OJNRdad5jwpaWOmEzs-Z_71QJcA-4M",
  authDomain: "searchanalytics-4bbbf.firebaseapp.com",
  databaseURL: "https://searchanalytics-4bbbf-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "searchanalytics-4bbbf",
};

  firebase.initializeApp(firebaseConfig);
</script>



<script>

const db = firebase.database();

/* =============================
   COUNTRIES
============================= */

db.ref("analytics/devices").on("value", snap => {

  const devices = snap.val();
  if (!devices) return;

  const countries = {};
  const deviceNames = {};
  const osCount = {};
  const browsers = {};

  let mobile = 0;
  let desktop = 0;
  let tablet = 0;
  let active = 0;

  Object.values(devices).forEach(device => {

    if (!device.sessions) return;

    Object.values(device.sessions).forEach(session => {

      /* COUNTRY */
      if (session.country)
        countries[session.country] =
          (countries[session.country] || 0) + 1;

      /* DEVICE NAME */
      const label = session.deviceLabel || session.device;
      if (label)
        deviceNames[label] =
          (deviceNames[label] || 0) + 1;

      /* OS */
      if (session.os)
        osCount[session.os] =
          (osCount[session.os] || 0) + 1;

      /* BROWSER */
      if (session.browser)
        browsers[session.browser] =
          (browsers[session.browser] || 0) + 1;

      /* DEVICE TYPE */
      const type = session.device || "";

      if (type.includes("iPhone") || type.includes("Android"))
        mobile++;
      else if (type.includes("iPad"))
        tablet++;
      else
        desktop++;

      /* REALTIME */
      if (session.isOnline === true)
        active++;

    });

  });

  /* ===== RENDER COUNTRIES ===== */

  const totalCountries = Object.values(countries).reduce((a,b)=>a+b,0);

  renderCountries(
    Object.keys(countries).map(name => ({
      country: name,
      visits: countries[name],
      pct: totalCountries ? ((countries[name]/totalCountries)*100).toFixed(1) : 0
    }))
  );

  /* ===== RENDER DEVICE TYPES ===== */

  const totalDevices = mobile + desktop + tablet;

  renderDeviceTypes([
    { type:"Mobile", icon:"📱", count:mobile, pct: totalDevices ? ((mobile/totalDevices)*100).toFixed(1) : 0 },
    { type:"Desktop", icon:"🖥️", count:desktop, pct: totalDevices ? ((desktop/totalDevices)*100).toFixed(1) : 0 },
    { type:"Tablet", icon:"📋", count:tablet, pct: totalDevices ? ((tablet/totalDevices)*100).toFixed(1) : 0 }
  ]);

  /* ===== RENDER DEVICE NAMES ===== */

  renderDeviceNames(
    Object.keys(deviceNames).map(name => ({
      name,
      count: deviceNames[name]
    }))
  );

  /* ===== RENDER OS ===== */

  const totalOS = Object.values(osCount).reduce((a,b)=>a+b,0);

  renderOS(
    Object.keys(osCount).map(name => ({
      name,
      count: osCount[name],
      pct: totalOS ? ((osCount[name]/totalOS)*100).toFixed(1) : 0
    }))
  );

  /* ===== RENDER BROWSERS ===== */

  const totalBrowsers = Object.values(browsers).reduce((a,b)=>a+b,0);

  renderBrowsers(
    Object.keys(browsers).map(name => ({
      name,
      count: browsers[name],
      pct: totalBrowsers ? ((browsers[name]/totalBrowsers)*100).toFixed(1) : 0
    }))
  );

  /* ===== REALTIME ===== */

  document.getElementById("realtimeCount").textContent = active;

});


/* =============================
   PAGES
============================= */

db.ref("analytics/pages").on("value", snap => {

  const pages = snap.val();
  if (!pages) return;

  const list = Object.keys(pages).map(key => ({
    title: key,
    path: "/" + key,
    views: pages[key].views || 0,
    unique: "-"
  })).sort((a,b)=>b.views - a.views);

  renderPages(list);

});


/* =============================
   OVERVIEW
============================= */

db.ref("analytics/overview").on("value", snap => {

  const data = snap.val();
  if (!data) return;

  const total = document.getElementById("totalVisits");
  const views = document.getElementById("pageViews");

  if (total) total.textContent = data.totalVisits || 0;
  if (views) views.textContent = data.pageViews || 0;

});

</script>


</body>

</html>
