}

html[data-theme="dark"]{
 --bg:#0f1115;

*{

html,
body{

/* ===== Global Reading Typography ===== */
body{

/* منع التحديد */
.topbar, button, .lang, .lang-item, .switch, h1, h2{

}

/* ===== TOP BAR ===== */
.topbar{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:1200px;
  background:var(--bar);
  backdrop-filter:blur(14px);
  border-radius:28px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  z-index:100;
}

.topbar{
  padding-inline: clamp(12px, 4vw, 28px);
}


.topbar-inner{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.title-slot{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  max-width:70%;
}




html[data-theme="dark"] .title-frame{
  background:rgba(255,255,255,.08);
}

 .title-text{
  font-weight:900;
  font-size:22px;
  line-height:1.4;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;  /* ← ذكي مش وحش */
}






  

.profile-btn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.06);
  text-decoration:none;
}

html[data-theme="dark"] .profile-btn{
  background:rgba(255,255,255,.12);
}




/* ===== CONTROLS ===== */
.profile-btn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.06);
  font-size: clamp(18px, 2.4vw, 18px);
  text-decoration:none;
  cursor:pointer;
}

html[data-theme="dark"] .profile-btn{
  background:rgba(255,255,255,.12);
}

.controls{
  display:flex;
  align-items:center;
  gap:16px;
}

/* ===== SWITCH ===== */
.switch{
  
  width:54px;
  height:28px;
  background:rgba(0,0,0,.15);
  border-radius:999px;
  position:relative;
  cursor:pointer;
}

.knob{
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.3s;
  display:flex;
  align-items:center;
  justify-content:center;
}

html[data-theme="dark"] .knob{
  left:29px;
  background:#000;
  color:#fff;
}
html[data-theme="dark"] .topbar{

}

.footer-col{

/* ===== Tooltip عام ===== */
.tooltip-wrap{
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.tooltip-text{
  position: absolute;
  bottom: -34px;              /* أقرب للزر */
  right: 50%;
  transform: translateX(50%) translateY(4px);

  background: rgba(0,0,0,.75);
  color: #fff;

  padding: 4px 10px;          /* ⬅️ أصغر */
  border-radius: 999px;

  font-size: 11px;            /* ⬅️ أصغر */
  font-weight: 600;
  line-height: 1.4;

  white-space: nowrap;

  opacity: 0;
  pointer-events: none;
  transition: .2s ease;

  box-shadow: 0 6px 16px rgba(0,0,0,.25);
}

/* سهم صغير */
.tooltip-text::after{
  content:"";
  position:absolute;
  top:-6px;
  right:50%;
  transform:translateX(50%);
  border:6px solid transparent;
  border-bottom-color:rgba(0,0,0,.8);
}

.tooltip-wrap:hover .tooltip-text{
  opacity:1;
  transform: translateX(50%) translateY(0);
}

/* دارك مود */
html[data-theme="dark"] .tooltip-text{
  background: rgba(255,255,255,.15);
  color:#fff;
}
html[data-theme="dark"] .tooltip-text::after{
  border-bottom-color: rgba(255,255,255,.15);
}

<script>


/* ================================
   INDEX AUTO REDIRECT SYSTEM
================================ */

const ONE_HOUR = 60 * 60 * 1000;
const lastPage = localStorage.getItem("lastPage");
const lastTime = localStorage.getItem("lastVisitTime");
const now = Date.now();

// نخفي الصفحة مؤقتًا لمنع الفلاش
document.documentElement.style.visibility = "hidden";

if (lastPage && lastTime && (now - parseInt(lastTime) < ONE_HOUR)) {

  if (!window.location.pathname.includes(lastPage)) {
    window.location.href = lastPage;
  } else {
    document.documentElement.style.visibility = "visible";
  }

} else {

  // أول مرة أو عدى ساعة
  document.documentElement.style.visibility = "visible";

}











const body = document.body;
const switchBtn = document.getElementById("themeSwitch");
const knob = document.getElementById("knob");





/* الوضع المحفوظ */
const savedTheme = localStorage.getItem("theme") || "light";
document.documentElement.dataset.theme = savedTheme;
knob.textContent = savedTheme === "dark" ? "🌙" : "☀️";




switchBtn.onclick = () => {
  const scrollY = window.scrollY;

  // 🔒 اقفل التصحيح التلقائي
  document.documentElement.classList.add("theme-switching");
  document.body.classList.add("theme-lock");

  const html = document.documentElement;
  const newTheme = html.dataset.theme === "dark" ? "light" : "dark";

  html.dataset.theme = newTheme;
  localStorage.setItem("theme", newTheme);
  knob.textContent = newTheme === "dark" ? "🌙" : "☀️";

  requestAnimationFrame(() => {
    window.scrollTo(0, scrollY);

    setTimeout(() => {
      document.body.classList.remove("theme-lock");
      document.documentElement.classList.remove("theme-switching");
    }, 80);
  });
};







/* ===== جدول المحتويات ===== */

  // طبّق الثيم فورًا
  html.dataset.theme = savedTheme;

  // لو فيه زرار سوتش
  const switchBtn = document.getElementById("themeSwitch");
  const knob = document.getElementById("knob");

  function syncKnob(theme){
    if (!knob) return;
    knob.textContent = theme === "dark" ? "🌙" : "☀️";
  }

  syncKnob(savedTheme);

  if (switchBtn) {
    switchBtn.onclick = () => {
      const newTheme =
        html.dataset.theme === "dark" ? "light" : "dark";

      html.dataset.theme = newTheme;
      localStorage.setItem("theme", newTheme);
      syncKnob(newTheme);
    };
  }
})();

window.addEventListener("load", () => {
